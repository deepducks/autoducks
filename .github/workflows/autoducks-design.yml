name: 'Autoducks: Design Agent'

on:
  issue_comment:
    types: [created]
  issues:
    types: [assigned]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write
jobs:
  design:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       (startsWith(github.event.comment.body, '/agents design') ||
        startsWith(github.event.comment.body, '/agents plan'))) ||
      (github.event_name == 'issues' &&
       github.event.issue.author_association != 'MANNEQUIN' &&
       contains(github.event.issue.labels.*.name, 'Draft'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize
        id: authz
        run: bash .autoducks/core/security/authorize.sh
        env:
          AUTODUCKS_AGENT: design
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=design bash .autoducks/core/config/load-agent-defaults.sh >> "$GITHUB_OUTPUT"
      - name: Parse directive
        id: directive
        if: steps.authz.outcome == 'success' && github.event_name == 'issue_comment'
        run: |
          source .autoducks/core/config/parse-directive.sh >> "$GITHUB_OUTPUT"
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
      - name: Pre-execution
        if: steps.authz.outcome == 'success'
        run: bash .autoducks/agents/design/pre.sh
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.sender.login }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        if: steps.authz.outcome == 'success'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/design/prompt.md
          allowed_tools: "Read,Write,Edit,Bash(read-only)"
          model: ${{ steps.directive.outputs.model || steps.agent.outputs.model }}
          reasoning: ${{ steps.directive.outputs.reasoning || steps.agent.outputs.reasoning }}
          max_turns: ${{ steps.directive.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Post-execution
        if: always() && steps.authz.outcome == 'success'
        run: bash .autoducks/agents/design/post.sh
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.sender.login }}
          MODEL: ${{ steps.directive.outputs.model || steps.agent.outputs.model }}
          REASONING: ${{ steps.directive.outputs.reasoning || steps.agent.outputs.reasoning }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
