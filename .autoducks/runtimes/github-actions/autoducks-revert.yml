name: 'Autoducks: Revert Agent'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  revert:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association != 'MANNEQUIN' &&
      startsWith(github.event.comment.body, '/revert')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize
        id: authz
        run: bash .autoducks/core/security/authorize.sh
        env:
          AUTODUCKS_AGENT: revert
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: User pre hook
        if: >-
          steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/revert-pre/action.yml') != ''
        uses: ./.github/actions/autoducks/revert-pre
        env:
          AUTODUCKS_STAGE: pre
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run revert
        id: run
        if: steps.authz.outcome == 'success'
        run: bash .autoducks/agents/revert/run.sh
        env:
          FEATURE_ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: User post hook
        if: >-
          always() && steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/revert-post/action.yml') != ''
        uses: ./.github/actions/autoducks/revert-post
        env:
          AUTODUCKS_STAGE: post
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          AGENT_OUTCOME: ${{ steps.run.outcome }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
