name: 'Autoducks: Custom Agent'

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      agent_name:
        required: true
        type: string
      issue_number:
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: ''
      effort:
        required: false
        type: string
        default: ''
      turns:
        required: false
        type: string
        default: ''
      steering:
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Keyed on the PR-or-issue number alone. The agent name would be the natural
# second component, but on a comment trigger it isn't available here: the
# expression engine has no way to split `/agent <name> …` out of the body, and
# keying on the body itself makes the group unbounded in length and lets two
# `/agent foo` invocations that differ only in steering text run concurrently —
# exactly what `cancel-in-progress: false` is meant to prevent.
# So invocations on the same issue serialize, including different custom
# agents. The trade is bigger than latency and worth stating plainly: GitHub
# keeps at most ONE pending run per group, so a third `/agent …` on the same
# issue while one run is executing and one is already queued cancels the
# queued one. That cancellation happens before the first step, so there is no
# 👀, no status comment and no failure notice — the command simply vanishes
# and has to be re-issued. Accepted because the alternative, keying on
# something derived from the body, is what let two runs of the same agent
# race two pushes to the same `agent/<name>/…` branch.
# A repeat invocation queues behind its predecessor rather than cancelling it —
# a cancelled run can leave a pushed `agent/…` branch with no PR and no
# response comment. Deliberately absent from the pipeline lanes' concurrency
# groups (architect/engineer/maestro/…): this lane never coordinates with them.
concurrency:
  group: >-
    autoducks-agent-${{
      github.event.issue.number || inputs.pr_number || inputs.issue_number
    }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       startsWith(github.event.comment.body, '/agent'))
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: apptoken
        shell: bash
        env:
          # Opt-in flag only (any non-empty value enables app mode). The broker
          # URL is hardcoded below — if it ever moves, sync autoducks. Absent
          # flag = skip before any network call, so PAT-only repos never reach
          # the central broker.
          AUTODUCKS_APP: ${{ vars.AUTODUCKS_APP }}
        run: |
          set -euo pipefail
          if [ -z "${AUTODUCKS_APP:-}" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BROKER="https://autoducks-api.gustavospgondim.workers.dev"
          OIDC=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autoducks-broker" | jq -r .value)
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" \
            "$BROKER/token" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "AUTODUCKS_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) ||
              github.event.issue.pull_request != null && format('refs/pull/{0}/head', github.event.issue.number) ||
              ''
            }}
      # Pin the machinery to the pipeline's cut commit BEFORE the agent runs, so
      # an agent editing .autoducks on its own branch cannot corrupt the scripts
      # that run its build, and the machinery cannot drift across waves/reviews
      # (bug #952). Every later step runs from "${AUTODUCKS_PINNED_ROOT}/.autoducks".
      - name: Snapshot machinery
        id: snapshot
        run: bash .autoducks/core/robustness/snapshot-machinery.sh
      # Resolve the custom agent's name BEFORE the Authorization Gate, so that
      # `custom_agents.agents.<name>.security.trusted_associations` can actually
      # narrow the lane policy (authorize.sh:112-118). pre.sh exports
      # AUTODUCKS_AGENT_NAME far too late — it runs after the gate, so without
      # this step the narrowing is dead code.
      #
      # This is pure text parsing: no reaction, no comment, no API write, no
      # definition file read. The "Authorization Gate is step 0 of observable
      # behavior" rule in .autoducks/design/AGENTS.md is about side effects, and
      # this step has none. An unparseable or malformed name yields an empty
      # value, which authorize.sh treats as "no narrowing" — the lane policy
      # applies unchanged and the run is refused later by pre.sh refusal 1.
      - name: Resolve agent name
        id: name
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CANDIDATE="$INPUT_AGENT_NAME"
          else
            CANDIDATE="$(bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/parse-directive.sh" \
              | sed -n 's/^agent_name=//p' | head -1)"
          fi
          if [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "agent_name=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo "agent_name=" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AGENT_NAME: ${{ inputs.agent_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Authorize
        id: authz
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/security/authorize.sh"
        env:
          AUTODUCKS_AGENT: agent
          AUTODUCKS_AGENT_NAME: ${{ steps.name.outputs.agent_name }}
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.pr_number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=agent bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/load-agent-defaults.sh" >> "$GITHUB_OUTPUT"
      - name: Set context
        id: ctx
        if: steps.authz.outcome == 'success'
        run: |
          # Every dispatch-supplied value arrives through env:, never spliced
          # into this script by the expression engine. A steering value holding
          # a backtick, $( ), or a newline is inert here: it is base64-encoded
          # before it reaches $GITHUB_OUTPUT and never evaluated as shell.
          # model/effort/turns are stripped of newlines so a multi-line value
          # cannot forge extra $GITHUB_OUTPUT lines; they are validated as
          # enums downstream.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_PR_NUMBER" ]]; then
              echo "issue_num=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "issue_num=$INPUT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
            fi
            echo "model=$(printf '%s' "$INPUT_MODEL" | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "effort=$(printf '%s' "$INPUT_EFFORT" | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "max_turns=$(printf '%s' "$INPUT_TURNS" | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "commenter=$GITHUB_ACTOR" >> "$GITHUB_OUTPUT"
            # Same charset rule parse-directive.sh applies on the comment path;
            # without it the dispatch path reached the filesystem unvalidated.
            if [[ "$INPUT_AGENT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "agent_name=$INPUT_AGENT_NAME" >> "$GITHUB_OUTPUT"
              echo "agent_name_error=" >> "$GITHUB_OUTPUT"
            else
              echo "agent_name=" >> "$GITHUB_OUTPUT"
              echo "agent_name_error=invalid-name" >> "$GITHUB_OUTPUT"
            fi
            echo "steering_prompt=$(printf '%s' "$INPUT_STEERING" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
            echo "command=" >> "$GITHUB_OUTPUT"
          else
            echo "issue_num=$EVENT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "is_pr=$EVENT_IS_PR" >> "$GITHUB_OUTPUT"
            echo "commenter=$EVENT_COMMENTER" >> "$GITHUB_OUTPUT"
            source "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/parse-directive.sh" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_EFFORT: ${{ inputs.effort }}
          INPUT_TURNS: ${{ inputs.turns }}
          INPUT_AGENT_NAME: ${{ inputs.agent_name }}
          INPUT_STEERING: ${{ inputs.steering }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
          EVENT_COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/agent/pre.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          AGENT_NAME: ${{ steps.ctx.outputs.agent_name }}
          AGENT_NAME_ERROR: ${{ steps.ctx.outputs.agent_name_error }}
          STEERING_PROMPT: ${{ steps.ctx.outputs.steering_prompt }}
          # Agent definitions and the config keys that grant them tools are
          # read from THIS ref, never from the checked-out tree. A definition
          # body becomes the agent's prompt, so on a PR — where the checkout
          # is refs/pull/N/head — running from the tree would execute
          # unreviewed content. Reading from the base branch is what makes
          # the design's "merged, reviewed repo content" premise true by
          # construction, and why this lane needs no tool ceiling.
          AUTODUCKS_BASE_REF: origin/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: User pre hook
        if: >-
          steps.authz.outcome == 'success' && steps.pre.outputs.skip != 'true' &&
          hashFiles('.github/actions/autoducks/agent-pre/action.yml') != ''
        uses: ./.github/actions/autoducks/agent-pre
        env:
          AUTODUCKS_AGENT: agent
          AUTODUCKS_STAGE: pre
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        id: llm
        if: steps.authz.outcome == 'success' && steps.pre.outputs.skip != 'true'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/agent/resolved-prompt.md
          allowed_tools: ${{ steps.pre.outputs.tools || steps.agent.outputs.tools }}
          model: ${{ steps.ctx.outputs.model || steps.pre.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.ctx.outputs.effort || steps.pre.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.ctx.outputs.max_turns || steps.pre.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          github_token: ${{ steps.apptoken.outputs.value }}
      - name: User post hook
        if: >-
          always() && steps.authz.outcome == 'success' && steps.pre.outputs.skip != 'true' &&
          hashFiles('.github/actions/autoducks/agent-post/action.yml') != ''
        uses: ./.github/actions/autoducks/agent-post
        env:
          AUTODUCKS_AGENT: agent
          AUTODUCKS_STAGE: post
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          AGENT_OUTCOME: ${{ steps.llm.outcome }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Post-execution
        id: post
        if: always() && steps.authz.outcome == 'success'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/agent/post.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          MODEL: ${{ steps.ctx.outputs.model || steps.pre.outputs.model || steps.agent.outputs.model }}
          EFFORT: ${{ steps.ctx.outputs.effort || steps.pre.outputs.effort || steps.agent.outputs.effort }}
          JOB_STATUS: ${{ job.status }}
          LLM_SKIPPED: ${{ steps.llm.outputs.skipped }}
          LLM_ERROR_SUBTYPE: ${{ steps.llm.outputs.error_subtype }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      # Last-resort backstop for a corrupted post.sh: a hook that dies (or exits
      # 0) without telling the issue anything would otherwise freeze a wave
      # silently (#952), so post a notice from pure YAML instead.
      # Gated on whether the hook *reported*, not on whether it *succeeded*:
      # every deliberate-failure path reports and then exits 1 on purpose, and
      # keying off `post.outcome` alone made the watchdog contradict the accurate
      # report it had just posted (#117). The reporting helpers set
      # `reported=true` in $GITHUB_OUTPUT before that exit; a genuinely corrupted
      # hook never reaches them, never sets it, and still trips the watchdog.
      - name: Failure watchdog
        if: >-
          always() && steps.authz.outcome == 'success' &&
          (steps.llm.outcome == 'failure' || steps.post.outcome != 'success') &&
          steps.post.outputs.reported != 'true'
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "⚠️ **Agent run failed and its post-execution hook did not report cleanly.** \
          This is a last-resort watchdog notice — the run's own failure reporting was \
          skipped or errored (possible corrupted \`post.sh\`). \
          [View the run logs](https://github.com/$REPO/actions/runs/$RUN_ID). \
          **Next:** re-run with a larger turn budget, or inspect the hook." || true
