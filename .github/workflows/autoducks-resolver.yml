name: 'Autoducks: Resolver Agent'

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      issue_number:
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: string
        default: ''
      actor:
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: ''
      effort:
        required: false
        type: string
        default: ''
      max_turns:
        required: false
        type: string
        default: ''
      child_slug:
        required: false
        type: string
        default: ''
      child_pr_number:
        required: false
        type: string
        default: ''
      child_branch:
        required: false
        type: string
        default: ''
      child_base:
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

# Serialize the resolver per PR: the automatic (synchronize) and manual
# (/resolve) entry points collide on the same group, so a PR is never
# resolved by two concurrent runs. Queue rather than cancel — cancelling
# mid-run could leave the branch half-fixed. A child-scoped dispatch keys on
# the child slug + PR number instead, so it serializes independently from
# any same-repo target sharing the same issue/PR number.
concurrency:
  group: autoducks-resolver-${{ inputs.child_pr_number != '' && format('child-{0}-{1}', inputs.child_slug, inputs.child_pr_number) || github.event.pull_request.number || github.event.issue.number || inputs.pr_number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  resolver:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'synchronize' &&
       github.event.pull_request.draft == false &&
       (startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'fix/')) &&
       !startsWith(github.event.pull_request.base.ref, 'feature/') &&
       !startsWith(github.event.pull_request.base.ref, 'fix/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       startsWith(github.event.comment.body, '/resolve'))
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: apptoken
        shell: bash
        env:
          # Opt-in flag only (any non-empty value enables app mode). The broker
          # URL is hardcoded below — if it ever moves, sync autoducks. Absent
          # flag = skip before any network call, so PAT-only repos never reach
          # the central broker.
          AUTODUCKS_APP: ${{ vars.AUTODUCKS_APP }}
        run: |
          set -euo pipefail
          if [ -z "${AUTODUCKS_APP:-}" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BROKER="https://autoducks-api.gustavospgondim.workers.dev"
          OIDC=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autoducks-broker" | jq -r .value)
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" \
            "$BROKER/token" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "AUTODUCKS_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref || '' }}
          token: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      # Pin the machinery to the pipeline's cut commit BEFORE the agent runs, so
      # an agent editing .autoducks on its own branch cannot corrupt the scripts
      # that run its build, and the machinery cannot drift across waves/reviews
      # (bug #952). Every later step runs from "${AUTODUCKS_PINNED_ROOT}/.autoducks".
      - name: Snapshot machinery
        id: snapshot
        run: bash .autoducks/core/robustness/snapshot-machinery.sh
      - name: Authorize
        id: authz
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/security/authorize.sh"
        env:
          AUTODUCKS_AGENT: resolver
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association || github.event.pull_request.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=resolver bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/load-agent-defaults.sh" >> "$GITHUB_OUTPUT"
      - name: Set context
        id: ctx
        if: steps.authz.outcome == 'success'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.pr_number }}" ]]; then
              echo "issue_num=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "issue_num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
            fi
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ inputs.effort }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=${{ inputs.max_turns }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ inputs.actor }}" >> "$GITHUB_OUTPUT"
            echo "command=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "issue_num=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "effort=" >> "$GITHUB_OUTPUT"
            echo "max_turns=" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.sender.login }}" >> "$GITHUB_OUTPUT"
            echo "command=" >> "$GITHUB_OUTPUT"
          else
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=${{ github.event.issue.pull_request != null }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
            source "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/parse-directive.sh" >> "$GITHUB_OUTPUT"
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/resolver/pre.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          CHILD_SLUG: ${{ inputs.child_slug }}
          CHILD_PR_NUMBER: ${{ inputs.child_pr_number }}
          CHILD_BRANCH: ${{ inputs.child_branch }}
          CHILD_BASE: ${{ inputs.child_base }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: User pre hook
        if: >-
          steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/resolver-pre/action.yml') != ''
        uses: ./.github/actions/autoducks/resolver-pre
        env:
          AUTODUCKS_AGENT: resolver
          AUTODUCKS_STAGE: pre
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        id: llm
        if: steps.authz.outcome == 'success'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/resolver/prompt.md
          allowed_tools: ${{ steps.agent.outputs.tools }}
          model: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.ctx.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          github_token: ${{ steps.apptoken.outputs.value }}
      - name: User post hook
        if: >-
          always() && steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/resolver-post/action.yml') != ''
        uses: ./.github/actions/autoducks/resolver-post
        env:
          AUTODUCKS_AGENT: resolver
          AUTODUCKS_STAGE: post
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          AGENT_OUTCOME: ${{ steps.llm.outcome }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Post-execution
        id: post
        if: always() && steps.authz.outcome == 'success'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/resolver/post.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          MODEL: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          EFFORT: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          OVERRIDE_MODEL: ${{ steps.ctx.outputs.model }}
          OVERRIDE_EFFORT: ${{ steps.ctx.outputs.effort }}
          OVERRIDE_MAX_TURNS: ${{ steps.ctx.outputs.max_turns }}
          JOB_STATUS: ${{ job.status }}
          LLM_SKIPPED: ${{ steps.llm.outputs.skipped }}
          CHILD_SLUG: ${{ inputs.child_slug }}
          CHILD_PR_NUMBER: ${{ inputs.child_pr_number }}
          CHILD_BRANCH: ${{ inputs.child_branch }}
          CHILD_BASE: ${{ inputs.child_base }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      # Last-resort backstop: if the LLM step failed or Post-execution did not
      # report cleanly (e.g. a corrupted hook that still exits 0), post a notice
      # from pure YAML so a broken hook can never silently freeze a wave (#952).
      - name: Failure watchdog
        if: >-
          always() && steps.authz.outcome == 'success' &&
          (steps.llm.outcome == 'failure' || steps.post.outcome != 'success')
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "⚠️ **Agent run failed and its post-execution hook did not report cleanly.** \
          This is a last-resort watchdog notice — the run's own failure reporting was \
          skipped or errored (possible corrupted \`post.sh\`). \
          [View the run logs](https://github.com/$REPO/actions/runs/$RUN_ID). \
          **Next:** re-run with a larger turn budget, or inspect the hook." || true
