name: 'Autoducks LLM - Claude'
description: 'Invoke Claude via claude-code-action for autoducks agents'

inputs:
  prompt_file:
    description: 'Path to the agent prompt markdown file'
    required: true
  allowed_tools:
    description: 'Comma-separated list of tools the agent can use'
    required: true
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-sonnet-5'
  effort:
    description: 'Effort level (off, low, medium, high, max)'
    required: false
    default: 'high'
  max_turns:
    description: 'Maximum number of agentic turns'
    required: false
    default: ''
  timeout_minutes:
    description: 'Timeout in minutes'
    required: false
    default: '60'
  anthropic_api_key:
    description: 'Anthropic API key (used if claude_code_oauth_token not set)'
    required: false
    default: ''
  claude_code_oauth_token:
    description: 'Claude Code OAuth token'
    required: false
    default: ''

outputs:
  error_subtype:
    description: 'Claude result subtype when the run errored, e.g. "error_max_turns", "error_during_execution"; empty on success'
    value: ${{ steps.result.outputs.error_subtype }}
  is_error:
    description: '"true" if the Claude run ended in error, "false" otherwise'
    value: ${{ steps.result.outputs.is_error }}
  conclusion:
    description: '"success" or "failure"'
    value: ${{ steps.result.outputs.conclusion }}

runs:
  using: 'composite'
  steps:
    - name: Read prompt
      id: prompt
      shell: bash
      env:
        EFFORT: ${{ inputs.effort }}
      run: |
        case "$EFFORT" in
          off)    THINK_PHRASE="" ;;
          low)    THINK_PHRASE="Think before writing." ;;
          medium) THINK_PHRASE="Think hard before writing." ;;
          high)   THINK_PHRASE="Think very hard before writing." ;;
          max)    THINK_PHRASE="Ultrathink — take extensive time to reason before writing." ;;
          *)      THINK_PHRASE="Think very hard before writing." ;;
        esac
        PROMPT=$(cat "${{ inputs.prompt_file }}")
        PROMPT="${PROMPT//\{\{THINK_PHRASE\}\}/$THINK_PHRASE}"
        {
          echo "content<<PROMPT_EOF"
          echo "$PROMPT"
          echo "PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Build claude args
      id: args
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
      run: |
        MT="${MAX_TURNS:-}"
        [[ -z "$MT" ]] && MT="50"
        ARGS="--model $MODEL --max-turns $MT --allowedTools '$ALLOWED_TOOLS'"
        echo "claude_args=$ARGS" >> "$GITHUB_OUTPUT"
        SETTINGS=".autoducks/providers/llm/claude/settings.json"
        [[ -f "$SETTINGS" ]] && echo "settings=$SETTINGS" >> "$GITHUB_OUTPUT" || echo "settings=" >> "$GITHUB_OUTPUT"
    - name: Run Claude agent
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.prompt.outputs.content }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        allowed_bots: '*'
        claude_args: ${{ steps.args.outputs.claude_args }}
        settings: ${{ steps.args.outputs.settings }}
    - name: Parse Claude result
      id: result
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        STEP_OUTCOME: ${{ steps.claude.outcome }}
      run: |
        # Vendor-specific parsing of claude-code-action's execution log lives
        # here so runtimes/scripts only ever see the normalized outputs below.
        ERROR_SUBTYPE=""
        IS_ERROR="false"

        if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
          RESULT_ENTRY=$(jq -c '[.[]? | select(.type == "result")] | last // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          if [[ -n "$RESULT_ENTRY" ]]; then
            IS_ERROR=$(echo "$RESULT_ENTRY" | jq -r 'if .is_error == true then "true" else "false" end')
            if [[ "$IS_ERROR" == "true" ]]; then
              ERROR_SUBTYPE=$(echo "$RESULT_ENTRY" | jq -r '.subtype // ""')
            fi
          fi
        fi

        CONCLUSION="success"
        if [[ "$IS_ERROR" == "true" || "$STEP_OUTCOME" == "failure" ]]; then
          CONCLUSION="failure"
        fi

        {
          echo "error_subtype=$ERROR_SUBTYPE"
          echo "is_error=$IS_ERROR"
          echo "conclusion=$CONCLUSION"
        } >> "$GITHUB_OUTPUT"
