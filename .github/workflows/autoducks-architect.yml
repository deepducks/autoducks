name: 'Autoducks: Architect Agent'

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      auto_chain:
        required: false
        type: string
        default: ''
      actor:
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: ''
      effort:
        required: false
        type: string
        default: ''
      max_turns:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: autoducks-architect-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  architect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       (startsWith(github.event.comment.body, '/architect') ||
        startsWith(github.event.comment.body, '/design')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize
        id: authz
        run: bash .autoducks/core/security/authorize.sh
        env:
          AUTODUCKS_AGENT: architect
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=architect bash .autoducks/core/config/load-agent-defaults.sh >> "$GITHUB_OUTPUT"
      - name: Set context
        id: ctx
        if: steps.authz.outcome == 'success'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "issue_num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ inputs.effort }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=${{ inputs.max_turns }}" >> "$GITHUB_OUTPUT"
            echo "auto_chain=${{ inputs.auto_chain }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ inputs.actor }}" >> "$GITHUB_OUTPUT"
            echo "command=" >> "$GITHUB_OUTPUT"
          else
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
            source .autoducks/core/config/parse-directive.sh >> "$GITHUB_OUTPUT"
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success'
        run: bash .autoducks/agents/architect/pre.sh
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          STEERING_PROMPT: ${{ steps.ctx.outputs.steering_prompt }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: User pre hook
        if: >-
          steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/architect-pre/action.yml') != ''
        uses: ./.github/actions/autoducks/architect-pre
        env:
          AUTODUCKS_AGENT: architect
          AUTODUCKS_STAGE: pre
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Snapshot hooks
        id: snapshot
        if: steps.authz.outcome == 'success'
        run: |
          SNAP="$RUNNER_TEMP/autoducks-snapshot"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          cp -a .autoducks "$SNAP/.autoducks"
          echo "root=$SNAP/.autoducks" >> "$GITHUB_OUTPUT"
      - name: Run LLM agent
        id: llm
        if: steps.authz.outcome == 'success'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/architect/prompt.md
          allowed_tools: "Read,Write,Edit,Bash(read-only),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git status:*),Bash(git branch --list:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*)"
          model: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.ctx.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: User post hook
        if: >-
          always() && steps.authz.outcome == 'success' &&
          hashFiles('.github/actions/autoducks/architect-post/action.yml') != ''
        uses: ./.github/actions/autoducks/architect-post
        env:
          AUTODUCKS_AGENT: architect
          AUTODUCKS_STAGE: post
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          AGENT_OUTCOME: ${{ steps.llm.outcome }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Post-execution
        id: post
        if: always() && steps.authz.outcome == 'success'
        run: bash "$RUNNER_TEMP/autoducks-snapshot/.autoducks/agents/architect/post.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          AUTO_CHAIN: ${{ steps.ctx.outputs.auto_chain }}
          MODEL: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          EFFORT: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          MAX_TURNS: ${{ steps.ctx.outputs.max_turns || steps.agent.outputs.max_turns }}
          OVERRIDE_MODEL: ${{ steps.ctx.outputs.model }}
          OVERRIDE_EFFORT: ${{ steps.ctx.outputs.effort }}
          OVERRIDE_MAX_TURNS: ${{ steps.ctx.outputs.max_turns }}
          JOB_STATUS: ${{ job.status }}
          LLM_SKIPPED: ${{ steps.llm.outputs.skipped }}
          LLM_ERROR_SUBTYPE: ${{ steps.llm.outputs.error_subtype }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Failure watchdog
        if: >-
          always() && steps.authz.outcome == 'success' &&
          (steps.llm.outcome == 'failure' || steps.post.outcome != 'success')
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "⚠️ **Agent run failed and its post-execution hook did not report cleanly.** \
          This is a last-resort watchdog notice — the run's own failure reporting was \
          skipped or errored (possible corrupted \`post.sh\`). \
          [View the run logs](https://github.com/$REPO/actions/runs/$RUN_ID). \
          **Next:** re-run with a larger turn budget, or inspect the hook." || true
