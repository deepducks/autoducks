# CI: runs the shell unit suite on every PR and on pushes to main.
#
# The suite is fully green (31/31) on both Linux (GNU) and macOS (BSD) as of #784,
# so this job now fails the run on any regression. To make it BLOCKING, add it as a
# required status check in main's branch protection — note this also gates the
# autoducks agents' auto-merges, so confirm the pipeline waits for it first.
name: CI — unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: shell unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Run test/unit-*.sh
        run: |
          set -uo pipefail
          pass=0; fail=0; failed=()
          for t in test/unit-*.sh; do
            if bash "$t" >/tmp/out 2>&1; then
              echo "✅ $(basename "$t")"
              pass=$((pass+1))
            else
              echo "❌ $(basename "$t")"
              sed 's/^/    /' /tmp/out | tail -20
              fail=$((fail+1)); failed+=("$(basename "$t")")
            fi
          done
          {
            echo "## Unit suite: $pass passed, $fail failed"
            if [ "$fail" -gt 0 ]; then
              printf '%s\n' "### Failing" "${failed[@]/#/- }"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Real signal (non-zero on failure); advisory because not a required check.
          [ "$fail" -eq 0 ]
