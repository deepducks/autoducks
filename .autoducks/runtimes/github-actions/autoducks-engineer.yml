name: 'Autoducks: Engineer Agent'

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      auto_chain:
        required: false
        type: string
        default: ''
      actor:
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: ''
      effort:
        required: false
        type: string
        default: ''
      max_turns:
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  engineer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       (
         startsWith(github.event.comment.body, '/quack engineer') ||
         startsWith(github.event.comment.body, '/quack tactics') ||
         (
           (startsWith(github.event.comment.body, '/quack execute') ||
            startsWith(github.event.comment.body, '/quack work') ||
            startsWith(github.event.comment.body, '/quack run')) &&
           !(github.event.issue.type.name == 'Task' ||
             contains(github.event.issue.labels.*.name, 'Task')) &&
           !contains(github.event.issue.labels.*.name, 'Tactics:done')
         )
       ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Authorize
        id: authz
        run: bash .autoducks/core/security/authorize.sh
        env:
          AUTODUCKS_AGENT: engineer
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=engineer bash .autoducks/core/config/load-agent-defaults.sh >> "$GITHUB_OUTPUT"
      - name: Set context
        id: ctx
        if: steps.authz.outcome == 'success'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "issue_num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ inputs.effort }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=${{ inputs.max_turns }}" >> "$GITHUB_OUTPUT"
            echo "auto_chain=${{ inputs.auto_chain }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ inputs.actor }}" >> "$GITHUB_OUTPUT"
            echo "command=" >> "$GITHUB_OUTPUT"
          else
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
            source .autoducks/core/config/parse-directive.sh >> "$GITHUB_OUTPUT"
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success'
        run: bash .autoducks/agents/engineer/pre.sh
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMAND: ${{ steps.ctx.outputs.command }}
          AUTO_CHAIN: ${{ steps.ctx.outputs.auto_chain }}
          OVERRIDE_MODEL: ${{ steps.ctx.outputs.model }}
          OVERRIDE_EFFORT: ${{ steps.ctx.outputs.effort }}
          OVERRIDE_MAX_TURNS: ${{ steps.ctx.outputs.max_turns }}
          STEERING_PROMPT: ${{ steps.ctx.outputs.steering_prompt }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        if: steps.authz.outcome == 'success' && steps.pre.outputs.dor_skip != 'true'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/engineer/prompt.md
          allowed_tools: "Read,Write,Glob,Grep"
          model: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.ctx.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Post-execution
        if: always() && steps.authz.outcome == 'success'
        run: bash .autoducks/agents/engineer/post.sh
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMAND: ${{ steps.ctx.outputs.command }}
          AUTO_CHAIN: ${{ steps.ctx.outputs.auto_chain }}
          MODEL: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          EFFORT: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          OVERRIDE_MODEL: ${{ steps.ctx.outputs.model }}
          OVERRIDE_EFFORT: ${{ steps.ctx.outputs.effort }}
          OVERRIDE_MAX_TURNS: ${{ steps.ctx.outputs.max_turns }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
