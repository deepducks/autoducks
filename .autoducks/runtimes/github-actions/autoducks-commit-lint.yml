name: 'Autoducks: Commit-message Lint'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: commit-message lint
    runs-on: ubuntu-latest
    # Skip PRs a parent metarepo opened on this child (marker in body / label):
    # the metarepo already reviewed the aggregate change, and this child's own
    # pipeline is meant to stay dormant for it. push:main still lints normally.
    if: >-
      github.event_name == 'push' ||
      (!contains(github.event.pull_request.body, 'autoducks:metarepo-managed') &&
       !contains(github.event.pull_request.labels.*.name, 'Autoducks:external'))
    steps:
      - name: Mint app token
        id: apptoken
        shell: bash
        env:
          # Opt-in flag only (any non-empty value enables app mode). The broker
          # URL is hardcoded below — if it ever moves, sync autoducks. Absent
          # flag = skip before any network call, so PAT-only repos never reach
          # the central broker.
          AUTODUCKS_APP: ${{ vars.AUTODUCKS_APP }}
        run: |
          set -euo pipefail
          if [ -z "${AUTODUCKS_APP:-}" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BROKER="https://autoducks-api.gustavospgondim.workers.dev"
          OIDC=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autoducks-broker" | jq -r .value)
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" \
            "$BROKER/token" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "AUTODUCKS_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y jq)
      - name: Commit-message lint
        run: |
          source .autoducks/core/config/load-config.sh
          source .autoducks/core/robustness/commit-lint.sh
          commit_lint::scan "$(commit_lint::collect_commits)"
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before || '' }}
