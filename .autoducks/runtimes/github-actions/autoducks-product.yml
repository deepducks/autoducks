name: 'Autoducks: Product Agent'

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: string
        default: 'false'
      model:
        required: false
        type: string
        default: ''
      effort:
        required: false
        type: string
        default: ''
      max_turns:
        required: false
        type: string
        default: ''
      actor:
        required: false
        type: string
        default: ''
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  id-token: write
  repository-projects: write

concurrency:
  group: autoducks-product
  cancel-in-progress: false

jobs:
  product:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       !(github.event.sender.type == 'Bot' &&
         (github.event.issue.type.name == 'Task' ||
          contains(github.event.issue.labels.*.name, 'Task')))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.author_association != 'MANNEQUIN' &&
       (startsWith(github.event.comment.body, '/triage') ||
        startsWith(github.event.comment.body, '/merge')))
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: apptoken
        shell: bash
        env:
          # Opt-in flag only (any non-empty value enables app mode). The broker
          # URL is hardcoded below — if it ever moves, sync autoducks. Absent
          # flag = skip before any network call, so PAT-only repos never reach
          # the central broker.
          AUTODUCKS_APP: ${{ vars.AUTODUCKS_APP }}
        run: |
          set -euo pipefail
          if [ -z "${AUTODUCKS_APP:-}" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BROKER="https://autoducks-api.gustavospgondim.workers.dev"
          OIDC=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autoducks-broker" | jq -r .value)
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" \
            "$BROKER/token" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "AUTODUCKS_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # Pin the machinery to the pipeline's cut commit BEFORE the agent runs, so
      # an agent editing .autoducks on its own branch cannot corrupt the scripts
      # that run its build, and the machinery cannot drift across waves/reviews
      # (bug #952). Every later step runs from "${AUTODUCKS_PINNED_ROOT}/.autoducks".
      - name: Snapshot machinery
        id: snapshot
        run: bash .autoducks/core/robustness/snapshot-machinery.sh
      - name: Authorize
        id: authz
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/security/authorize.sh"
        env:
          AUTODUCKS_AGENT: >-
            ${{
              (github.event_name == 'issue_comment' &&
               startsWith(github.event.comment.body, '/merge'))
              && 'merge' || 'triage'
            }}
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=product bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/core/config/load-agent-defaults.sh" >> "$GITHUB_OUTPUT"
      - name: Set context
        id: ctx
        if: steps.authz.outcome == 'success'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=triage" >> "$GITHUB_OUTPUT"
            echo "issue_num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "comment_issue_num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ inputs.effort }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=${{ inputs.max_turns }}" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ inputs.actor }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/merge') }}" == "true" ]]; then
            echo "mode=merge" >> "$GITHUB_OUTPUT"
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "comment_issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.comment.user.login }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "mode=triage" >> "$GITHUB_OUTPUT"
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "comment_issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.sender.login }}" >> "$GITHUB_OUTPUT"
          else
            # Human `/triage` comment: scope stays a full backlog sweep
            # (issue_num empty — see the WARNING in
            # scripts/smoke-test-product.sh), but comment_issue_num still
            # carries the commented issue so pre.sh/post.sh can post the
            # editable bot status comment there.
            echo "mode=triage" >> "$GITHUB_OUTPUT"
            echo "issue_num=" >> "$GITHUB_OUTPUT"
            echo "comment_issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "commenter=${{ github.event.comment.user.login || github.event.sender.login }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success' && steps.ctx.outputs.mode == 'triage'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/product/pre.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          COMMENT_ISSUE_NUM: ${{ steps.ctx.outputs.comment_issue_num }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: User pre hook
        if: >-
          steps.authz.outcome == 'success' &&
          steps.ctx.outputs.mode == 'triage' &&
          hashFiles('.github/actions/autoducks/product-pre/action.yml') != ''
        uses: ./.github/actions/autoducks/product-pre
        env:
          AUTODUCKS_AGENT: product
          AUTODUCKS_STAGE: pre
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          COMMENT_ISSUE_NUM: ${{ steps.ctx.outputs.comment_issue_num }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        id: llm
        if: steps.authz.outcome == 'success' && steps.ctx.outputs.mode == 'triage'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/product/prompt.md
          allowed_tools: ${{ steps.agent.outputs.tools }}
          model: ${{ steps.ctx.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.ctx.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.ctx.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          github_token: ${{ steps.apptoken.outputs.value }}
      - name: User post hook
        if: >-
          always() && steps.authz.outcome == 'success' &&
          steps.ctx.outputs.mode == 'triage' &&
          hashFiles('.github/actions/autoducks/product-post/action.yml') != ''
        uses: ./.github/actions/autoducks/product-post
        env:
          AUTODUCKS_AGENT: product
          AUTODUCKS_STAGE: post
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          COMMENT_ISSUE_NUM: ${{ steps.ctx.outputs.comment_issue_num }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          AGENT_OUTCOME: ${{ steps.llm.outcome }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Post-execution
        id: post
        if: always() && steps.authz.outcome == 'success' && steps.ctx.outputs.mode == 'triage'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/product/post.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          COMMENT_ISSUE_NUM: ${{ steps.ctx.outputs.comment_issue_num }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
          LLM_SKIPPED: ${{ steps.llm.outputs.skipped }}
          LLM_ERROR_SUBTYPE: ${{ steps.llm.outputs.error_subtype }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Merge
        if: steps.authz.outcome == 'success' && steps.ctx.outputs.mode == 'merge'
        run: bash "${AUTODUCKS_PINNED_ROOT:-.}/.autoducks/agents/product/merge.sh"
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ steps.ctx.outputs.commenter }}
          DRY_RUN: ${{ steps.ctx.outputs.dry_run }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      # Last-resort backstop: if the LLM step failed or Post-execution did not
      # report cleanly (e.g. a corrupted hook that still exits 0), post a notice
      # from pure YAML so a broken hook can never silently freeze a wave (#952).
      - name: Failure watchdog
        if: >-
          always() && steps.authz.outcome == 'success' &&
          steps.ctx.outputs.mode == 'triage' &&
          (steps.llm.outcome == 'failure' || steps.post.outcome != 'success')
        env:
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_num }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.apptoken.outputs.value || secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "⚠️ **Agent run failed and its post-execution hook did not report cleanly.** \
          This is a last-resort watchdog notice — the run's own failure reporting was \
          skipped or errored (possible corrupted \`post.sh\`). \
          [View the run logs](https://github.com/$REPO/actions/runs/$RUN_ID). \
          **Next:** re-run with a larger turn budget, or inspect the hook." || true
