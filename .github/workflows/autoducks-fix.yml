name: 'Autoducks: Fix Agent'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association != 'MANNEQUIN' &&
      startsWith(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Authorize
        id: authz
        run: bash .autoducks/core/security/authorize.sh
        env:
          AUTODUCKS_AGENT: fix
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id || '0' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load agent defaults
        id: agent
        if: steps.authz.outcome == 'success'
        run: AUTODUCKS_AGENT=fix bash .autoducks/core/config/load-agent-defaults.sh >> "$GITHUB_OUTPUT"
      - name: Parse directive
        id: directive
        if: steps.authz.outcome == 'success'
        run: source .autoducks/core/config/parse-directive.sh >> "$GITHUB_OUTPUT"
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
      - name: Pre-execution
        id: pre
        if: steps.authz.outcome == 'success'
        run: bash .autoducks/agents/fix/pre.sh
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
      - name: Run LLM agent
        id: llm
        if: steps.authz.outcome == 'success'
        uses: ./.autoducks/providers/llm/claude
        with:
          prompt_file: .autoducks/agents/fix/prompt.md
          allowed_tools: "Read,Write,Edit,Bash,Glob,Grep"
          model: ${{ steps.directive.outputs.model || steps.agent.outputs.model }}
          effort: ${{ steps.directive.outputs.effort || steps.agent.outputs.effort }}
          max_turns: ${{ steps.directive.outputs.max_turns || steps.agent.outputs.max_turns }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Post-execution
        if: always() && steps.authz.outcome == 'success'
        run: bash .autoducks/agents/fix/post.sh
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          MODEL: ${{ steps.directive.outputs.model || steps.agent.outputs.model }}
          EFFORT: ${{ steps.directive.outputs.effort || steps.agent.outputs.effort }}
          GH_TOKEN: ${{ secrets.AUTODUCKS_PAT || secrets.GITHUB_TOKEN }}
          LLM_ERROR_SUBTYPE: ${{ steps.llm.outputs.error_subtype }}
