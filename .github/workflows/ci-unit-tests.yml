# CI: runs the shell unit suite for the autoducks orchestration logic.
#
# The suite is fully green (31/31) on both Linux (GNU) and macOS (BSD) as of #784,
# so this job fails the run on any regression. It is a required status check on
# main's branch protection — note this also gates the autoducks agents'
# auto-merges, so confirm the pipeline waits for it first.
#
# WHEN IT RUNS (deliberately narrow — see #818 investigation):
#   * pull_request → `ready_for_review`, `opened`, `reopened`, but the job
#     skips any PR still in draft (see the `unit` job's `if:`). The Maestro
#     opens the feature→main PR as a draft up front (run.sh:104-110) and flips
#     it ready only when every wave has merged (run.sh:279 → `gh pr ready`), so
#     `ready_for_review` fires exactly once, at delivery — the draft `opened`
#     is skipped, and `synchronize` (every task push during the run) is not a
#     trigger at all. A human PR opened/reopened directly as NON-draft still
#     runs once via `opened`/`reopened`, so the required check never hangs.
#   * push → validates main after a merge lands.
#
# The `unit` job is reported for every triggering event (so the required check
# is never left pending — which a `paths:` filter on the trigger would cause),
# but it does real work only when (a) the PR is not a draft AND (b) files that
# could affect the suite changed. A docs-only PR (e.g. #826) reports the check
# green without spinning the 31 suites; a draft PR reports green via a skipped
# job. Skipped jobs/steps count as successful for branch protection.
#
# PUSHING TO AN ALREADY-READY PR — the escape hatch.
# The trigger list above has no `synchronize`, so a commit pushed after the PR
# went ready produces no new run. The check GitHub shows then belongs to an
# earlier SHA: either absent for the new head (PR blocked, nothing in the UI
# unblocks it) or, worse, present and green from before the change (#1168 hit
# the failing-then-fixed variant of this).
#
# The fix is NOT to add `synchronize` — that is exactly what #818 removed, and
# it would re-run the full suite on every task push of every Maestro wave.
# Instead, re-fire one of the accepted triggers by toggling the PR:
#
#     gh pr ready --undo <N> && gh pr ready <N>
#
# `ready_for_review` fires on the second call and the suite runs against the
# current head. Do this whenever you push to a PR that is already ready — it is
# the supported way to refresh the check, not a workaround. The Maestro's own
# flow does not need it: it stays draft until delivery, so its single
# `ready_for_review` already lands on the final head.
name: CI — unit tests

on:
  pull_request:
    types: [ready_for_review, opened, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: shell unit suite
    runs-on: ubuntu-latest
    # Skip draft PRs: the Maestro's feature PR sits in draft through the whole
    # run and fires `opened` while still empty. A skipped job reports the
    # required check as successful, so drafts never block; the real run happens
    # on `ready_for_review`. Non-PR events (push) and non-draft PRs run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '.autoducks/**'
              - 'test/unit-*.sh'
              - '.github/workflows/ci-unit-tests.yml'
      - name: Ensure jq
        if: steps.changes.outputs.relevant == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Run test/unit-*.sh
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -uo pipefail
          pass=0; fail=0; failed=()
          for t in test/unit-*.sh; do
            if bash "$t" >/tmp/out 2>&1; then
              echo "✅ $(basename "$t")"
              pass=$((pass+1))
            else
              echo "❌ $(basename "$t")"
              sed 's/^/    /' /tmp/out | tail -20
              fail=$((fail+1)); failed+=("$(basename "$t")")
            fi
          done
          {
            echo "## Unit suite: $pass passed, $fail failed"
            if [ "$fail" -gt 0 ]; then
              printf '%s\n' "### Failing" "${failed[@]/#/- }"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Real signal (non-zero on failure).
          [ "$fail" -eq 0 ]
      - name: Skipped (no relevant changes)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No changes under .autoducks/**, test/unit-*.sh, or this workflow — unit suite skipped."
