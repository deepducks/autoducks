name: 'Autoducks: Install'
# Cloud-setup installer. The setup wizard (autoducks-api) commits this file plus
# autoducks.json to an `autoducks/setup*` branch and opens a PR; the push fires
# this workflow, which pulls the machinery (install.sh --app-mode) and commits it
# to the same branch so the whole change is reviewable in the PR. Requires the
# autoducks GitHub App installed (the broker mints the token used to push the
# machinery — GITHUB_TOKEN cannot write .github/workflows/ files).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Pin machinery to a commit SHA/tag (default: main)'
        required: false
        default: ''
  push:
    branches:
      - 'autoducks/setup**'

permissions:
  id-token: write
  contents: write

jobs:
  install:
    # Safety: only ever run on a setup branch, never on a default branch.
    if: startsWith(github.ref_name, 'autoducks/setup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint app token
        id: apptoken
        shell: bash
        run: |
          set -euo pipefail
          BROKER="https://autoducks-api.gustavospgondim.workers.dev"
          OIDC=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=autoducks-broker" | jq -r .value)
          TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $OIDC" "$BROKER/token" | jq -r .token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "app not installed / broker refused"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Install machinery (app mode)
        shell: bash
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/deepducks/autoducks/main/scripts/install.sh -o /tmp/autoducks-install.sh
          bash /tmp/autoducks-install.sh --app-mode --no-setup ${REF:+--ref "$REF"}
      - name: Commit machinery to the setup branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git config user.name "autoducks[bot]"
          git config user.email "autoducks[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "chore(autoducks): install machinery (app mode)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
